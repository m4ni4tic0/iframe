<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#09051b">
  <title>Distrito 99</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <style>
    :root { color-scheme: dark; --pink:#ff00b8; --cyan:#00eaff; --violet:#592cff; --tile-w:96px; --tile-h:62px; }
    * { box-sizing: border-box; }
    html, body { width:100%; min-height:100%; margin:0; }
    body { min-height:100vh; min-height:100dvh; position:relative; isolation:isolate; overflow-x:hidden; }
    .mosaic {
      position:fixed; z-index:-1; inset:-100px; overflow:hidden; pointer-events:none;
      background:linear-gradient(125deg,#08071c 0%,#250640 30%,#111044 56%,#06374a 78%,#09051b 100%);
      background-size:180% 180%;
      animation:gradient-breathe 16s ease-in-out infinite alternate;
    }
    .mosaic::before { content:""; position:absolute; inset:-18%; pointer-events:none; }
    .mosaic::before {
      background:radial-gradient(ellipse at 15% 25%,#ff00b86b,transparent 37%),
                 radial-gradient(ellipse at 78% 72%,#00eaff45,transparent 38%),
                 radial-gradient(ellipse at 55% 10%,#592cff55,transparent 40%);
      animation:aurora 12s ease-in-out infinite alternate;
    }
    .mosaic-pattern {
      position:absolute; left:-100vw; top:-100vh; width:300vw; height:300vh; opacity:.76;
      animation:diagonal-drift 72s linear infinite alternate;
      will-change:transform;
    }
    .mosaic-line {
      position:absolute; left:0; width:100%; height:var(--tile-h);
      background-image:url("logo-distrito99-tile.png"); background-repeat:repeat-x;
      background-size:var(--tile-w) auto; background-position:0 center;
    }
    .mosaic-line.staggered { background-position:calc(var(--tile-w) / 2) center; }
    @keyframes diagonal-drift { from { transform:translate3d(0,100vh,0); } to { transform:translate3d(100vw,0,0); } }
    @keyframes aurora { from { transform:translate3d(-2%,0,0) scale(.96); opacity:.75; } to { transform:translate3d(2%,-2%,0) scale(1.08); opacity:1; } }
    @keyframes gradient-breathe { from { background-position:0% 50%; } to { background-position:100% 50%; } }
    @keyframes border-breathe {
      from { opacity:.52; filter:brightness(.78) drop-shadow(0 0 4px #ff00b855) drop-shadow(0 0 7px #592cff44); }
      to { opacity:1; filter:brightness(1.25) drop-shadow(0 0 8px #ff00b899) drop-shadow(0 0 15px #00eaff88); }
    }
    .rules-panel {
      position:fixed; z-index:4; top:50%; right:max(16px,env(safe-area-inset-right));
      width:min(205px,calc(100vw - 20px - env(safe-area-inset-left) - env(safe-area-inset-right)));
      height:auto;
      display:flex; flex-direction:column; padding:12px 10px 9px;
      color:#fff; background:linear-gradient(155deg,#130b25e8,#090d1ce8 65%,#071b27e8);
      border:1px solid transparent; border-radius:28px;
      box-shadow:-14px 0 38px #0009,0 0 26px #ff00b844;
      transform:translateY(-50%);
      overflow:hidden;
    }
    .rules-panel::before {
      content:""; position:absolute; z-index:0; inset:-1px; padding:2px; border-radius:inherit;
      background:linear-gradient(125deg,var(--pink),var(--violet),var(--cyan),var(--pink));
      -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
      -webkit-mask-composite:xor; mask-composite:exclude; pointer-events:none;
      opacity:.65; filter:brightness(.85) drop-shadow(0 0 5px #ff00b866);
      animation:border-breathe 2.8s ease-in-out infinite alternate;
    }
    .rules-panel > * { position:relative; z-index:1; }
    .rules-heading { display:flex; justify-content:center; align-items:center; gap:5px; padding-bottom:6px; border-bottom:1px solid #00eaff55; text-align:center; }
    .rules-heading h2 { width:100%; margin:0; color:#fff; font-size:12px; letter-spacing:.035em; text-transform:uppercase; text-align:center; text-shadow:0 0 14px #ff00b877; overflow-wrap:anywhere; }
    .rules-heading h2 span { color:var(--cyan); }
    .rules-list { display:grid; gap:3px; margin:6px 0 0; padding:0; list-style:none; counter-reset:rule; }
    .rules-list li { counter-increment:rule; display:grid; grid-template-columns:16px 18px minmax(0,1fr); align-items:center; gap:5px; padding:4px 5px; border:1px solid #ffffff16; border-radius:7px; color:#e9e6f2; background:linear-gradient(100deg,#ff00b812,#00eaff0b); font-size:9.5px; line-height:1.18; overflow-wrap:anywhere; transition:transform .22s ease,border-color .22s ease,background .22s ease,box-shadow .22s ease; }
    .rules-list li::before { content:counter(rule,decimal-leading-zero); color:var(--cyan); font-weight:700; text-shadow:0 0 10px #00eaff88; }
    .rules-list li:hover { transform:translateX(-5px); border-color:#00eaff99; background:linear-gradient(100deg,#ff00b82a,#00eaff20); box-shadow:0 0 17px #00eaff20,0 0 15px #ff00b81c; }
    .rule-icon { color:#ff56d1; font-size:15px; text-align:center; filter:drop-shadow(0 0 5px #ff00b866); transition:color .22s ease,transform .22s ease; }
    .rules-list li:hover .rule-icon { color:var(--cyan); transform:scale(1.16); }
    @media (max-width:600px) {
      :root { --tile-w:76px; --tile-h:50px; }
      .rules-panel { top:50%; right:max(6px,env(safe-area-inset-right)); width:min(205px,calc(100vw - 12px - env(safe-area-inset-left) - env(safe-area-inset-right))); padding:10px 7px 7px; border-radius:20px; }
      .rules-heading { gap:4px; padding-bottom:5px; }
      .rules-list { gap:3px; margin-top:5px; }
      .rules-list li { grid-template-columns:16px 18px minmax(0,1fr); gap:5px; padding:4px; font-size:9.5px; }
    }
    @media (max-height:500px) and (orientation:landscape) {
      .rules-panel { padding-top:7px; padding-bottom:7px; }
      .rules-heading { padding-bottom:4px; }
      .rules-list { gap:2px; margin-top:4px; }
      .rules-list li { padding-top:3px; padding-bottom:3px; font-size:9px; }
      .rules-footer { padding-top:10px; }
    }
    @media (prefers-reduced-motion:reduce) { .rules-list li,.rule-icon { transition:none; }.rules-panel::before { animation-duration:18s; } }
    body {
      display:grid; place-items:center; padding:24px;
      color:#fff; font-family:Arial,Helvetica,sans-serif;
    }
  </style>
</head>
<body>
  <div class="mosaic" aria-hidden="true"><div class="mosaic-pattern" id="mosaicPattern"></div></div>
  <aside class="rules-panel" id="rulesPanel" role="complementary" aria-labelledby="rulesTitle">
    <div class="rules-heading">
      <h2 id="rulesTitle">Normativas <span>Generales</span></h2>
    </div>
    <ol class="rules-list">
      <li><i class="rule-icon fa-solid fa-comment-slash" aria-hidden="true"></i><span>No Insultar.</span></li>
      <li><i class="rule-icon fa-solid fa-shield-halved" aria-hidden="true"></i><span>Respetar al Staff.</span></li>
      <li><i class="rule-icon fa-solid fa-bullhorn" aria-hidden="true"></i><span>No Spam.</span></li>
      <li><i class="rule-icon fa-solid fa-comments" aria-hidden="true"></i><span>No Flood.</span></li>
      <li><i class="rule-icon fa-solid fa-award" aria-hidden="true"></i><span>No Pedir Rango.</span></li>
      <li><i class="rule-icon fa-solid fa-user-lock" aria-hidden="true"></i><span>No dar datos personales.</span></li>
      <li><i class="rule-icon fa-solid fa-circle-exclamation" aria-hidden="true"></i><span>Prohibido Contenido +18.</span></li>
      <li><i class="rule-icon fa-solid fa-music" aria-hidden="true"></i><span>No pedir Música.</span></li>
      <li><i class="rule-icon fa-solid fa-gift" aria-hidden="true"></i><span>No pedir Days, Xats ni Powers.</span></li>
      <li><i class="rule-icon fa-solid fa-gavel" aria-hidden="true"></i><span>No admin abuse. (Tener una razón válida.)</span></li>
    </ol>
  </aside>
  <script>
    (() => {
      const pattern = document.getElementById('mosaicPattern');
      let resizeTimer;

      function buildMosaicLines() {
        const lineHeight = window.innerWidth <= 600 ? 50 : 62;
        const lineCount = Math.ceil((window.innerHeight * 3 + 300) / lineHeight);
        const fragment = document.createDocumentFragment();

        for (let lineIndex = 0; lineIndex < lineCount; lineIndex++) {
          const line = document.createElement('div');
          line.className = `mosaic-line${lineIndex % 2 ? ' staggered' : ''}`;
          line.style.top = `${lineIndex * lineHeight}px`;
          fragment.appendChild(line);
        }
        pattern.replaceChildren(fragment);
      }

      buildMosaicLines();
      window.addEventListener('resize', () => {
        window.clearTimeout(resizeTimer);
        resizeTimer = window.setTimeout(buildMosaicLines, 180);
      }, { passive:true });
    })();
  </script>
</body>
</html>
